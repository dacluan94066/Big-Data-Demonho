# =====================================================
# HDFS Cloud Drive Demo - Application Configuration
# =====================================================

server.port=8080
spring.application.name=hdfs-cloud-drive

# =====================================================
# MySQL Database - Lưu METADATA của file
# Sửa password theo cấu hình MySQL của bạn
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/hdfs_cloud_drive?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - KHÔNG để Spring Boot tự tạo/sửa schema
# Chạy schema.sql và data.sql thủ công
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =====================================================
# Apache HDFS Configuration
# Kết nối đến NameNode: hdfs://localhost:9000
# Xem giao diện web tại: http://localhost:9870
# =====================================================
hdfs.uri=hdfs://localhost:9000
hdfs.root.path=/cloud-drive

# =====================================================
# File Upload
# =====================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# =====================================================
# Logging
# =====================================================
logging.level.com.hdfs.clouddrive=DEBUG
logging.level.org.apache.hadoop=WARN
logging.level.org.apache.hadoop.security=ERROR
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
