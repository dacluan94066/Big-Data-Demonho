<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFS Cloud Drive — Đăng Nhập</title>
    <meta name="description" content="HDFS Cloud Drive Demo - Ứng dụng lưu trữ file sử dụng Apache HDFS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(88, 166, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 166, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Glow orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 8s ease-in-out infinite;
        }
        .glow-orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.15), transparent);
            top: -100px; left: -100px;
        }
        .glow-orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(63, 185, 80, 0.12), transparent);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        /* Floating particles */
        .particles { position: fixed; inset: 0; pointer-events: none; }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(88, 166, 255, 0.5);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
        }

        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 20px;
            padding: 44px 40px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(88, 166, 255, 0.08),
                0 32px 64px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(88, 166, 255, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(56, 139, 253, 0.4);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(56, 139, 253, 0.4); }
            50% { box-shadow: 0 8px 48px rgba(56, 139, 253, 0.7); }
        }

        .logo-section h1 {
            font-size: 24px;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .logo-section p {
            font-size: 13px;
            color: #7d8590;
            font-weight: 400;
        }

        .hdfs-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            color: #58a6ff;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #e6edf3;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #388bfd;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
            background: rgba(13, 17, 23, 1);
        }

        .form-group input::placeholder {
            color: #484f58;
        }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #388bfd, #58a6ff);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(56, 139, 253, 0.4);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Demo info box */
        .demo-info {
            margin-top: 24px;
            padding: 14px 16px;
            background: rgba(48, 54, 61, 0.3);
            border: 1px solid #30363d;
            border-radius: 10px;
            text-align: center;
        }

        .demo-info p {
            font-size: 12px;
            color: #7d8590;
            line-height: 1.7;
        }

        .demo-info strong { color: #58a6ff; }

        /* Error message */
        .error-msg {
            display: none;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ff7b72;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Tech stack badges */
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tech-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge-hdfs { background: rgba(88,166,255,0.1); color: #58a6ff; border: 1px solid rgba(88,166,255,0.2); }
        .badge-spring { background: rgba(63,185,80,0.1); color: #3fb950; border: 1px solid rgba(63,185,80,0.2); }
        .badge-mysql { background: rgba(210,153,34,0.1); color: #d29922; border: 1px solid rgba(210,153,34,0.2); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="particles" id="particles"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-icon">🗄️</div>
                <h1>HDFS Cloud Drive</h1>
                <p>Demo lưu trữ file với Apache HDFS</p>
                <div class="hdfs-badge">
                    <span>●</span> Apache Hadoop Distributed File System
                </div>
            </div>

            <!-- Error message -->
            <div class="error-msg" id="errorMsg"></div>

            <!-- Login form -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="admin"
                           value="admin" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="••••••"
                           value="123456" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Đăng nhập</span>
                    <div class="btn-spinner" id="btnSpinner"></div>
                </button>
            </form>

            <!-- Demo info -->
            <div class="demo-info">
                <p>
                    Demo account: <strong>admin</strong> / <strong>123456</strong><br>
                    File được lưu trên <strong>Apache HDFS</strong> · Metadata trên <strong>MySQL</strong>
                </p>
            </div>

            <!-- Tech badges -->
            <div class="tech-stack">
                <span class="tech-badge badge-hdfs">Apache HDFS</span>
                <span class="tech-badge badge-spring">Spring Boot</span>
                <span class="tech-badge badge-mysql">MySQL</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Generate floating particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 15) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
            p.style.opacity = (0.2 + Math.random() * 0.6).toString();
            container.appendChild(p);
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginBtn = document.getElementById('loginBtn');

            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save session
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('fullName', data.fullName || data.username);

                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error(data.error || 'Đăng nhập thất bại');
                }
            } catch (err) {
                errorMsg.textContent = err.message.includes('fetch') ?
                    '❌ Không thể kết nối đến server. Kiểm tra Spring Boot đang chạy trên port 8080.' :
                    '❌ ' + err.message;
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        });

        // Tự động đăng nhập sẵn tài khoản admin cho buổi demo
        localStorage.setItem('token', 'demo-token-admin');
        localStorage.setItem('username', 'admin');
        localStorage.setItem('fullName', 'Quản trị viên (Admin)');
        window.location.href = 'dashboard.html';
    </script>
</body>
</html>
